name: .NET CI - Lint, Build, Test, Artifact

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:latest
        options: >-
          --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Aspire CLI
        run: |
          dotnet workload restore
          dotnet workload install aspire
      
      - name: Start Docker daemon
        run: |
          sudo service docker start || sudo systemctl start docker
          docker ps

      - name: Restore
        run: dotnet restore

      - name: Install dotnet-format (tool)
        run: |
          dotnet tool install --global dotnet-format --version 10.* || true
        env:
          PATH: ${{ env.PATH }}:/home/runner/.dotnet/tools

      - name: Run dotnet format (check)
        run: dotnet format --verify-no-changes --verbosity minimal
        env:
          PATH: ${{ env.PATH }}:/home/runner/.dotnet/tools

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger:"trx;LogFileName=test-results.trx"
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          ASPIRE_ALLOW_UNSECURED_TRANSPORT: true
          ASPNETCORE_ENVIRONMENT: Development  # Fuerza desarrollo en CI
          TEST_BUILD_TIMEOUT_SECONDS: 600       # 10 minutos
          TEST_REQUEST_TIMEOUT_SECONDS: 120     # 2 minutos por request

      - name: Publish
        run: dotnet publish -c Release -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-publish
          path: ./publish
