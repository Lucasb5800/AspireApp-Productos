name: .NET CI - Lint, Build, Test, Artifact

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Aspire CLI
        run: |
          dotnet workload restore
          dotnet workload install aspire

      - name: Verify Docker daemon
        run: |
          docker version
          docker ps

      - name: Restore
        run: dotnet restore

      - name: Install dotnet-format (tool)
        run: |
          dotnet tool install --global dotnet-format --version 10.* || true
        env:
          PATH: ${{ env.PATH }}:/home/runner/.dotnet/tools

      - name: Run dotnet format (check)
        run: dotnet format --verify-no-changes --verbosity minimal
        env:
          PATH: ${{ env.PATH }}:/home/runner/.dotnet/tools

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger:"trx;LogFileName=test-results.trx"
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          ASPIRE_ALLOW_UNSECURED_TRANSPORT: true
          ASPNETCORE_ENVIRONMENT: Development
          TEST_BUILD_TIMEOUT_SECONDS: 900       # Aumentado a 15 minutos
          TEST_REQUEST_TIMEOUT_SECONDS: 300     # 5 minutos por request

      - name: Publish
        run: dotnet publish -c Release -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-publish
          path: ./publish
