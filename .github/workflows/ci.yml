name: .NET CI - Lint, Build, Test, Artifact

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Install dotnet-format (tool)
        run: |
          dotnet tool install --global dotnet-format --version 7.* || true
        env:
          PATH: ${{ env.PATH }}:/home/runner/.dotnet/tools

      - name: Run dotnet format (check)
        run: dotnet format --verify-no-changes --verbosity minimal
        env:
          PATH: ${{ env.PATH }}:/home/runner/.dotnet/tools

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger:"trx;LogFileName=test-results.trx"

      - name: Publish
        run: dotnet publish -c Release -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-publish
          path: ./publish
