name: .NET CI - Lint, Build, Test, Artifact

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Aspire CLI
        run: |
          dotnet workload restore
          dotnet workload install aspire

      - name: Restore
        run: dotnet restore

      - name: Install dotnet-format (tool)
        run: |
          dotnet tool install --global dotnet-format --version 10.* || true
        env:
          PATH: ${{ env.PATH }}:/home/runner/.dotnet/tools

      - name: Run dotnet format (check)
        run: dotnet format --verify-no-changes --verbosity minimal
        env:
          PATH: ${{ env.PATH }}:/home/runner/.dotnet/tools

      # Cambiamos a Debug si tu modo local con SQLite funciona en Debug
      - name: Build
        run: dotnet build --no-restore -c Debug

      - name: Test
        run: dotnet test --no-build -c Debug --logger:"trx;LogFileName=test-results.trx"
        env:
          ASPIRE_ALLOW_UNSECURED_TRANSPORT: true
          ASPNETCORE_ENVIRONMENT: Development
          UseSQLite: "true"                      # Fuerza explícitamente SQLite si tu código lo lee
          TEST_BUILD_TIMEOUT_SECONDS: 300       # 5 minutos son más que suficientes para SQLite
          TEST_REQUEST_TIMEOUT_SECONDS: 60

      - name: Publish
        run: dotnet publish -c Release -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-publish
          path: ./publish
